name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Own checks (${{ matrix.os }}, py${{ matrix.python }}, pytest ${{ matrix.pytest }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pytest: ["8", "9"]
        include:
          - { os: macos-latest, python: "3.12", pytest: "9" }
          - { os: windows-latest, python: "3.12", pytest: "9" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv pip install "pytest~=${{ matrix.pytest }}.0"
      - run: uv run --no-sync pytest

  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv venv smoke && uv pip install --python smoke/bin/python dist/*.whl && smoke/bin/python -c "import falsetto; print(falsetto.__version__)"
